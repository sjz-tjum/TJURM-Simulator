# PlugYourRM 配置：仿真 / 实体 / 界面，三合一。

sim:
  # 观测/预测的表达系：G = 相对自车底盘（自车运动混在观测里），W = 绝对世界。只差一次平移。
  frame: G
  sim_fps: 200
  sensor_fps: 50
  world_scale: 100.0
  # 像素噪声（px）。默认 0 = 理想观测，便于开发与自检可复现；
  # 做贴近真实检测器的评测时建议开 0.3~0.5（旧项目实测 sigma=0.5 时 diff 的 psi 抖动 mean 5.4 度）。
  pixel_noise_sigma: 0.0
  pnp_method: qcqp
  air_density: 1.2
  gravity: 9.8
  seed: 42

  camera:
    # 像素量化精度（保留几位小数，1 -> 0.1 px）；-1 = 不量化。用来做精度影响实验。
    pixel_decimals: 1
    focal_len: 800.0
    max_range: 10.0
    image_width: 1280
    image_height: 1024
    min_edge_px: 4.0

  aim:
    stale_limit: 0.6
    slew_limit_deg: 450.0
    pitch_slew_deg: 360.0
    # 车 / 前哨的默认冷却。
    cooldown: 0.1
    # 符的专属冷却——灯臂亮起时，每 0.8s 发一发。
    # 灯臂 hit_window = 2.5s，0.8s 节奏在窗口内能打 3 发，打不中还有机会。
    rune_cooldown: 0.8

  gimbal:
    alpha_max_yaw: 120.0
    alpha_max_pitch: 80.0
    yaw_outer: {kp: 7.0, ki: 0.0, kd: 0.0, max_output: 20.0}
    yaw_inner: {kp: 25.0, ki: 0.0, kd: 0.0, max_output: 80.0}
    pitch_outer: {kp: 10.0, ki: 0.0, kd: 0.1, max_output: 20.0}
    pitch_inner: {kp: 40.0, ki: 1.0, kd: 0.0, max_output: 80.0}

  motion:
    tar_speed: 1.5
    r_step_slow: 2.0
    r_step_fast: 8.0
    g_step_slow: 2.0
    g_step_pitch: 0.2
    mass: 1.0
    fric_coef: 0.5
    motor_gain: 6.0
    max_force: 20.0
    max_speed: 10.0
    max_rotate_speed: 20.0
    # 目标机动预设参数（KP7 循环 static / spin_slow / spin_fast / patrol 用）
    # 两个小陀螺速度对应 MultiTargetParams.spin_thresh（默认 3.0 rad/s）的两侧：
    spin_slow: 2.0               # rad/s，慢速小陀螺——低于阈值，车走 auto（追板）
    spin_fast: 8.0               # rad/s，快速小陀螺——高于阈值，车走 single（虚拟点）
    patrol_radius: 1.0           # m，圆周半径
    patrol_speed: 0.6            # m/s，切向线速度
    patrol_radial_gain: 3.0      # 1/s，径向校正增益

  # custom 中介（设备驱动）：sim 只入队，设备线程按自己的帧率出队并发到 public_bus。
  # dt 的钳制不在这一层 —— 观测时间戳都在消息里，那是跟踪器自己的事。
  custom:
    queue_size: 10
    target_fps: 300.0

  bullet:
    fire_delay: 0.02
    manual_interval: 0.1
    max_age: 5.0
    max_range: 50.0
    hit_retention: 0.5


