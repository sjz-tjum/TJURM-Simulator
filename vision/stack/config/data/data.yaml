outpost:
  radius: 0.275
  armor_count: 3
  base_height: 1.114
  height_step: 0.102
  rotate_speed: 2.51327
  armor_size: small
  light_bar_interval: 0.135
  light_bar_length: 0.055
  hp: 600
  priority: 5
  armor_tilt: 15.0           # 前哨装甲板朝下低 15°（FLU：低头为正）


rune:
  leaf_count: 5
  radius: 0.7
  height: 1.0
  target_diameter: 0.30
  armor_size: small
  light_bar_interval: 0.135
  light_bar_length: 0.055
  ring_inner_diameter: 0.03
  ring_count: 10
  small_speed: 1.0472
  big_speed: 1.0472
  activation_a: [0.780, 1.045]
  activation_omega: [1.884, 2.000]
  activation_b_base: 2.090
  hit_window: 2.5
  second_window: 1.0
  groups: 5
  min_bullet_speed: 12.0
  ring_gate: false
  ring_min_after_activation: [1, 4, 7]
  flash_period: 1.0
  flash_count: 5
  # 可激活标识（旧项目图 5-22 口径）：三条红环带的**直径**区间（mm），
  # 用来在相机视图里标出"这一发该打哪一环"。旧版是 Rune 上的类常量，
  # 新版按"几何常量进配置"的惯例落到这里，渲染器只读配置。
  mark_bands: [[230.0, 270.0], [110.0, 150.0], [30.0, 70.0]]
  mark_cross_half_angle: 7.0          # 十字每臂 ±7 度（共 14 度）
  mark_cross_inner_diameter: 100.0    # 十字臂从 Ø300 伸到 Ø100（mm）
  priority: 6


